output: data/safety_mcq.jsonl
seed: 42
strict: true
shuffle_options: true
answer_format: boxed
include_source: true
include_metadata: true

splits:
  enabled: true
  output_dir: data/mcq_safety
  seed: 42
  metadata_json_string: true
  stratify_by_source: true
  ratios:
    train: 0.9
    valid: 0.05
    test: 0.05

huggingface:
  repo_id: cs-552-2026-vibe-trainers/mcq_safety
  repo_type: dataset
  path_in_repo: .
  create_repo: true
  upload: true
  dry_run: false
  commit_message: Upload MCQ safety split files

quality:
  deduplicate_prompts: true
  drop_conflicting_prompts: true
  require_unique_options: true
  min_options: 2
  max_options: 26

sampling:
  safetybench:
    mode: all
  salad:
    mode: all
  wildguard:
    mode: fraction_of_total
    fraction: 0.25

safetybench:
  question_url: https://raw.githubusercontent.com/thu-coai/SafetyBench/main/opensource_data/test_en.json
  answer_url: https://raw.githubusercontent.com/thu-coai/SafetyBench/main/opensource_data/test_answers_en.json

salad:
  dataset: OpenSafetyLab/Salad-Data
  config: mcq_set
  split: train

wildguard:
  dataset: allenai/wildguardmix
  config: wildguardtrain
  split: train
  target_ratios:
    prompt: 0.75
    response: 0.25
  prompt_template_file: configs/wildguard_prompt_templates.jsonl
  category_synonym_file: null
  option_count_min: 4
  option_count_typical_max: 6
  option_count_max: 15
  large_option_ratio: 0.08
  binary_option_ratio: 0.05
  hard_distractor_ratio: 0.65
  binary_unsafe_labels:
    - Unsafe
    - Harmful
    - Risky
